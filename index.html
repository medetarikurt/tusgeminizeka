<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUS Asistanı</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f6f6f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151618" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3406/3406828.png">
  <style>
    :root {
      --bg: #f6f6f5;
      --surface: #ffffff;
      --text: #1d1e20;
      --muted: #6b6e73;
      --line: #deded9;
      --accent: #34567d;
      --accent-text: #ffffff;
      --accent-soft: #e9eef4;
      --ok: #2b7248;
      --ok-soft: #e8f3ec;
      --bad: #a8372e;
      --bad-soft: #f8eae8;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151618;
        --surface: #1c1d20;
        --text: #e4e4e1;
        --muted: #9a9ca1;
        --line: #2c2e33;
        --accent: #8fb0d6;
        --accent-text: #11151a;
        --accent-soft: #212a35;
        --ok: #84c79d;
        --ok-soft: #1c2a21;
        --bad: #e49188;
        --bad-soft: #2c1f1e;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body {
      margin: 0; min-height: 100vh;
      font-family: var(--sans); font-size: 15px; line-height: 1.5;
      color: var(--text); background: var(--bg);
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 18px; }
    .hidden { display: none !important; }

    /* Üst alan */
    header { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 0 10px; }
    header h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
    #authStatus { font-size: 12px; color: var(--muted); }
    #authStatus::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
    #authStatus.ok::before { background: var(--ok); }
    #authStatus.err::before { background: var(--bad); }

    /* Sekmeler */
    nav { display: flex; gap: 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 10; padding-top: env(safe-area-inset-top, 0px); }
    nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 0; margin-bottom: -1px; color: var(--muted); font-weight: 500; }
    nav button.on { color: var(--text); border-bottom-color: var(--accent); }
    .count { font-size: 12px; margin-left: 4px; color: var(--muted); }
    .count.due { color: var(--accent-text); background: var(--accent); border-radius: 9px; padding: 1px 7px; }

    main { padding: 22px 0 90px; }
    section > * + * { margin-top: 18px; }

    /* Metin ve alanlar */
    h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
    .muted { color: var(--muted); font-size: 13px; }
    textarea {
      width: 100%; resize: vertical; min-height: 84px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    }
    textarea:focus, button:focus-visible, label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    textarea:focus { outline-offset: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
      padding: 9px 14px; font-weight: 500; text-align: center;
    }
    .btn:hover { border-color: var(--muted); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .btn.primary:hover { opacity: .92; }
    .btn.block { width: 100%; }
    .btn:disabled { opacity: .55; cursor: default; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > .btn { flex: 1; }
    .link { background: none; border: 0; padding: 2px 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
    .link:hover { color: var(--text); }
    .link.danger:hover { color: var(--bad); }

    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
    .seg button { background: none; border: 0; padding: 6px 12px; font-size: 13px; color: var(--muted); }
    .seg button.on { background: var(--accent-soft); color: var(--text); font-weight: 600; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

    #imagePreviewContainer img { width: 100%; max-height: 260px; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: block; }
    #imagePreviewContainer .bar { margin-top: 8px; }

    /* Okuma metni */
    .reading { font-family: var(--serif); font-size: 16.5px; line-height: 1.7; }
    .reading strong { font-weight: 700; }
    .spot { font-family: var(--serif); font-size: 17px; line-height: 1.6; padding: 2px 0 2px 14px; border-left: 3px solid var(--accent); }
    .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .pre { white-space: pre-wrap; }

    /* Sonuç alanı */
    #resultCard { border-top: 1px solid var(--line); padding-top: 20px; }
    #resultCard h3 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }

    /* Arşiv listesi */
    .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { white-space: nowrap; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
    .chip.on { background: var(--accent-soft); border-color: transparent; color: var(--text); font-weight: 600; }

    .item { padding: 18px 0; border-top: 1px solid var(--line); }
    #questionsList { margin-top: 10px; }
    #questionsList .item:first-child { border-top: 0; padding-top: 8px; }
    .item-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .item-title { font-weight: 600; }
    .item-meta { color: var(--muted); font-size: 13px; margin-top: 1px; }
    .item .spot { margin: 12px 0 10px; }
    .item-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .item-foot .actions { display: flex; gap: 14px; }
    details summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: "+ "; }
    details[open] summary::before { content: "– "; }
    details .reading { margin-top: 10px; font-size: 16px; }
    .empty { padding: 36px 0; text-align: center; color: var(--muted); }

    /* Quiz */
    #quizContainer { border-top: 1px solid var(--line); padding-top: 18px; }
    #quizContainer > * + * { margin-top: 16px; }
    .quiz-q { font-family: var(--serif); font-size: 17px; line-height: 1.65; }
    .opt {
      display: flex; gap: 12px; align-items: baseline; width: 100%; text-align: left;
      background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px;
    }
    .opt + .opt { margin-top: 8px; }
    .opt:not(:disabled):hover { border-color: var(--muted); }
    .opt .k { color: var(--muted); font-weight: 600; width: 1ch; flex-shrink: 0; }
    .opt.right { border-color: var(--ok); background: var(--ok-soft); }
    .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
    .opt:disabled { cursor: default; color: var(--text); }
    #quizResult { border-radius: 8px; padding: 14px; }
    #quizResult.right { background: var(--ok-soft); }
    #quizResult.wrong { background: var(--bad-soft); }
    #quizResultTitle { font-weight: 600; }
    #quizResult.right #quizResultTitle { color: var(--ok); }
    #quizResult.wrong #quizResultTitle { color: var(--bad); }
    #quizResult .note { margin-top: 6px; font-size: 14px; color: var(--muted); }
    #quizExplanation { margin-top: 10px; font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; }
    #quizResult .btn { margin-top: 14px; }

    /* Geri al bildirimi */
    #toast {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      background: var(--text); color: var(--bg); border-radius: 8px; padding: 10px 14px;
      display: flex; gap: 16px; align-items: center; font-size: 14px; z-index: 50;
    }
    #toast button { background: none; border: 0; color: inherit; font-weight: 600; text-decoration: underline; padding: 0; }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>TUS Asistanı</h1>
    <div id="authStatus">Bağlanıyor</div>
  </header>

  <nav>
    <button id="tabAddBtn" class="on" onclick="switchTab('add')">Soru ekle</button>
    <button id="tabArchiveBtn" onclick="switchTab('archive')">Arşiv<span class="count" id="archiveCount">0</span></button>
    <button id="tabQuizBtn" onclick="switchTab('quiz')">Test<span class="count due hidden" id="dueBadge">0</span></button>
  </nav>

  <main>

    <!-- Soru ekle -->
    <section id="sectionAdd">
      <div class="bar">
        <span class="muted">Model</span>
        <div class="seg">
          <button id="modelFlash" class="on" onclick="setModel('gemini-3.8-flash')">Flash, hızlı</button>
          <button id="modelPro" onclick="setModel('gemini-3.8-pro')">Pro, derin vaka</button>
        </div>
      </div>

      <div class="row">
        <label class="btn primary">
          Fotoğraf çek
          <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageSelect(event)">
        </label>
        <label class="btn">
          Galeriden seç
          <input type="file" id="galleryInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
        </label>
      </div>

      <div id="imagePreviewContainer" class="hidden">
        <img id="imagePreview" alt="Seçilen soru görseli">
        <div class="bar"><span class="muted">Görsel hazır</span><button class="link danger" onclick="clearImage()">Kaldır</button></div>
      </div>

      <textarea id="questionInput" rows="3" placeholder="Soruyu yazabilir ya da fotoğrafa not ekleyebilirsin. Örnek: C şıkkını anlamadım."></textarea>

      <button id="analyzeBtn" class="btn primary block" onclick="analyzeAndSaveQuestion()">Analiz et ve kaydet</button>

      <div id="resultCard" class="hidden">
        <div class="bar" style="align-items:flex-start">
          <div>
            <h3 id="resSubBadge">Konu</h3>
            <div class="item-meta" id="resBadge">Branş</div>
          </div>
          <span id="resSaved" class="muted">Kaydedildi</span>
        </div>
        <div class="spot" id="resKeyTakeaway" style="margin-top:16px"></div>
        <div style="margin-top:20px">
          <div class="label">Çözüm ve patofizyoloji</div>
          <div id="resExplanation" class="reading pre"></div>
        </div>
      </div>
    </section>

    <!-- Arşiv -->
    <section id="sectionArchive" class="hidden">
      <div class="bar">
        <div class="seg">
          <button id="statusActive" class="on" onclick="setStatus('active')">Çalışılacak <span id="cntActive">0</span></button>
          <button id="statusLearned" onclick="setStatus('learned')">Öğrenilen <span id="cntLearned">0</span></button>
        </div>
        <button class="link" onclick="loadUserQuestions()">Yenile</button>
      </div>
      <div id="branchFilters" class="chips"></div>
      <div id="questionsList"><div class="empty">Yükleniyor</div></div>
    </section>

    <!-- Test -->
    <section id="sectionQuiz" class="hidden">
      <div>
        <h2>Tekrar testi</h2>
        <div class="muted">Önce vadesi gelen spotlar sorulur. Bugün vadesi gelen: <span id="dueCount">0</span></div>
      </div>
      <button id="newQuizBtn" class="btn primary block" onclick="generateQuiz()">Soru getir</button>

      <div id="quizContainer" class="hidden">
        <div class="bar">
          <span id="quizSubBadge" class="muted">Konu</span>
          <span id="quizStreakBadge" class="muted">Seviye 0/5</span>
        </div>
        <p id="quizQuestion" class="quiz-q" style="margin-bottom:0"></p>
        <div id="quizOptions"></div>
        <div id="quizResult" class="hidden">
          <div id="quizResultTitle"></div>
          <div id="quizNote" class="note"></div>
          <p id="quizExplanation"></p>
          <button class="btn block" onclick="generateQuiz()">Sıradaki soru</button>
        </div>
      </div>
    </section>

  </main>
</div>

<div id="toast" class="hidden"><span id="toastText"></span><button id="toastUndo">Geri al</button></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAS-Xf6I1xDlep59iZAphe-PzJFzddS-N8",
    authDomain: "tusaistanzeka.firebaseapp.com",
    projectId: "tusaistanzeka",
    storageBucket: "tusaistanzeka.firebasestorage.app",
    messagingSenderId: "686279505904",
    appId: "1:686279505904:web:c6ecfb760106e4476ccf35",
    measurementId: "G-9SC3CQ1771"
  };
  const WORKER_URL = "https://tusgeminizeka.medetarikurt.workers.dev";
  const COL = "tus_questions";
  const INTERVAL_DAYS = [1, 3, 7, 21];
  const DAY = 86400000;

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let selectedImageBase64 = null, selectedImageMime = null;
  let currentModel = "gemini-3.8-flash";
  let allQuestions = [];
  let selectedBranchFilter = "All";
  let selectedStatus = "active";
  let activeQuizQuestion = null, currentQuizData = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // Kaçışlı metinde **kalın** işaretlerini kalın yazıya çevirir
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

  function setAuth(text, cls) { const el = $("authStatus"); el.textContent = text; el.className = cls || ""; }

  signInAnonymously(auth).catch(err => console.error("Auth hatası:", err));

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      setAuth("Bağlı", "ok");
      let known = JSON.parse(localStorage.getItem("tus_known_uids") || "[]");
      if (!known.includes(user.uid)) { known.push(user.uid); localStorage.setItem("tus_known_uids", JSON.stringify(known)); }
      await migrateOldData(known);
      await loadUserQuestions();
    } else {
      setAuth("Bağlantı yok", "err");
    }
  });

  async function migrateOldData(uids) {
    for (const uid of uids) {
      try {
        const snap = await getDocs(collection(db, "users", uid, "questions"));
        for (const d of snap.docs) {
          const data = d.data();
          if (data.branch !== "SİSTEM MESAJI" && data.branch !== "API HATASI") await setDoc(doc(db, COL, d.id), data);
          await deleteDoc(d.ref);
        }
      } catch (e) {}
    }
  }

  function extractCleanJSON(raw) {
    const cleaned = raw.replace(/```json/gi, "").replace(/```/g, "").trim();
    const a = cleaned.indexOf("{"), b = cleaned.lastIndexOf("}");
    if (a !== -1 && b !== -1) return JSON.parse(cleaned.substring(a, b + 1));
    return JSON.parse(cleaned);
  }

  async function callWorker(body) {
    const res = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(res.status === 429 ? "Ücretsiz kota doldu, biraz sonra tekrar dene." : "Sunucu hatası (" + res.status + ")");
    const data = await res.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!text) throw new Error("Yapay zeka yanıtı alınamadı.");
    return text;
  }

  function showToast(text, onUndo) {
    const t = $("toast");
    $("toastText").textContent = text;
    t.classList.remove("hidden");
    clearTimeout(showToast.timer);
    $("toastUndo").onclick = async () => { t.classList.add("hidden"); await onUndo(); };
    showToast.timer = setTimeout(() => t.classList.add("hidden"), 7000);
  }

  window.switchTab = (tab) => {
    $("sectionAdd").classList.toggle("hidden", tab !== "add");
    $("sectionArchive").classList.toggle("hidden", tab !== "archive");
    $("sectionQuiz").classList.toggle("hidden", tab !== "quiz");
    $("tabAddBtn").classList.toggle("on", tab === "add");
    $("tabArchiveBtn").classList.toggle("on", tab === "archive");
    $("tabQuizBtn").classList.toggle("on", tab === "quiz");
  };

  window.setModel = (model) => {
    currentModel = model;
    const isPro = model.includes("pro");
    $("modelFlash").classList.toggle("on", !isPro);
    $("modelPro").classList.toggle("on", isPro);
  };

  window.handleImageSelect = (event) => {
    const file = event.target.files[0];
    if (!file) return;
    selectedImageMime = "image/jpeg";
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const max = 1280;
        let w = img.width, h = img.height;
        if (w > h) { if (w > max) { h *= max / w; w = max; } }
        else { if (h > max) { w *= max / h; h = max; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        selectedImageBase64 = dataUrl.split(",")[1];
        $("imagePreview").src = dataUrl;
        $("imagePreviewContainer").classList.remove("hidden");
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

  window.clearImage = () => {
    selectedImageBase64 = null; selectedImageMime = null;
    $("cameraInput").value = ""; $("galleryInput").value = "";
    $("imagePreviewContainer").classList.add("hidden");
  };

  // Benzer spot kontrolü
  const words = s => new Set(String(s || "").toLowerCase().replace(/[^a-z0-9çğıöşüâî\s]/gi, " ").split(/\s+/).filter(w => w.length > 2));
  function similarity(a, b) {
    const A = words(a), B = words(b);
    if (!A.size || !B.size) return 0;
    let inter = 0; A.forEach(w => { if (B.has(w)) inter++; });
    return inter / (A.size + B.size - inter);
  }
  function findDuplicate(p) {
    const sub = (p.subTopic || "").trim().toLowerCase();
    return allQuestions.find(q =>
      (sub && (q.subTopic || "").trim().toLowerCase() === sub && q.branch === p.branch) ||
      similarity(q.keyTakeaway, p.keyTakeaway) >= 0.55);
  }

  window.analyzeAndSaveQuestion = async () => {
    const questionText = $("questionInput").value.trim();
    if (!questionText && !selectedImageBase64) { alert("Önce sorunun fotoğrafını çek ya da metni yaz."); return; }

    const btn = $("analyzeBtn");
    btn.disabled = true; btn.textContent = "Çözülüyor…";

    const prompt = `
Sen uzman bir TUS (Tıpta Uzmanlık Sınavı) hocasısın. Görevin aşağıda fotoğrafı veya metni verilen TUS sorusunu/notunu analiz etmek.
Cevabı KESİNLİKLE sadece aşağıdaki geçerli JSON formatında ver, dışına hiçbir açıklama ekleme:
{
  "branch": "Branş Adı (Sadece şunlardan biri: Dahiliye, Pediatri, Genel Cerrahi, Kadın Doğum, Küçük Stajlar, Anatomi, Fizyoloji, Biyokimya, Mikrobiyoloji, Patoloji, Farmakoloji)",
  "topic": "Konu Başlığı (Örn: Hematoloji)",
  "subTopic": "Alt Konu (Örn: G6PD Eksikliği / Favizm)",
  "keyTakeaway": "TUS'ta soru yaptıracak 1-2 cümlelik çok net, vurucu SPOT bilgi",
  "explanation": "Sorunun detaylı patofizyolojik çözümü, doğru cevabın mekanizması ve çeldirici şıkların neden yanlış olduğunun net analizi"
}
Kullanıcı Notu / Soru Metni: ${questionText}
    `;

    try {
      const text = await callWorker({ prompt, model: currentModel, imageBase64: selectedImageBase64, mimeType: selectedImageMime });
      const parsed = extractCleanJSON(text);
      let saved = false;

      if (parsed.branch !== "SİSTEM MESAJI" && parsed.branch !== "API HATASI") {
        const dup = findDuplicate(parsed);
        let doSave = true;
        if (dup) doSave = confirm(`Benzer bir spot zaten arşivinde var:\n\n"${dup.keyTakeaway}"\n\nYine de yeni kayıt olarak eklensin mi?`);
        if (doSave) {
          await addDoc(collection(db, COL), {
            branch: parsed.branch || "Genel",
            topic: parsed.topic || "Genel",
            subTopic: parsed.subTopic || "",
            rawQuestion: questionText || "Fotoğraflı TUS sorusu",
            aiExplanation: parsed.explanation || "",
            keyTakeaway: parsed.keyTakeaway || "",
            box: 0, nextReview: Date.now(), learned: false, deleted: false,
            createdAtMs: Date.now()
          });
          saved = true;
        }
      }

      $("resSaved").textContent = saved ? "Kaydedildi" : "Kaydedilmedi";
      $("resBadge").textContent = [parsed.branch, parsed.topic].filter(Boolean).join(", ");
      $("resSubBadge").textContent = parsed.subTopic || parsed.topic || "";
      $("resKeyTakeaway").innerHTML = fmt(parsed.keyTakeaway || "");
      $("resExplanation").innerHTML = fmt(parsed.explanation || "");
      $("resultCard").classList.remove("hidden");

      $("questionInput").value = "";
      clearImage();
      await loadUserQuestions();
    } catch (err) {
      console.error("Analiz hatası:", err);
      alert("Çözüm sırasında hata oluştu: " + err.message);
    } finally {
      btn.disabled = false; btn.textContent = "Analiz et ve kaydet";
    }
  };

  window.loadUserQuestions = async () => {
    try {
      const snap = await getDocs(collection(db, COL));
      const items = [];
      snap.forEach(d => {
        const data = d.data();
        if (data.deleted === true) return;
        if (data.branch === "SİSTEM MESAJI" || data.branch === "API HATASI") return;
        items.push({
          id: d.id, ...data,
          box: typeof data.box === "number" ? data.box : 0,
          nextReview: typeof data.nextReview === "number" ? data.nextReview : 0,
          learned: data.learned === true,
          sortTime: data.createdAtMs || (data.createdAt?.seconds ? data.createdAt.seconds * 1000 : 0)
        });
      });
      items.sort((a, b) => b.sortTime - a.sortTime);
      allQuestions = items;
      refreshAll();
    } catch (err) { console.error("Arşiv yükleme hatası:", err); }
  };

  function refreshAll() {
    const active = allQuestions.filter(q => !q.learned);
    const due = active.filter(q => q.nextReview <= Date.now()).length;
    $("archiveCount").textContent = active.length;
    $("cntActive").textContent = active.length;
    $("cntLearned").textContent = allQuestions.length - active.length;
    $("dueCount").textContent = due;
    $("dueBadge").textContent = due;
    $("dueBadge").classList.toggle("hidden", due === 0);
    renderFilters(); renderQuestions();
  }

  window.setStatus = (s) => {
    selectedStatus = s; selectedBranchFilter = "All";
    $("statusActive").classList.toggle("on", s === "active");
    $("statusLearned").classList.toggle("on", s === "learned");
    renderFilters(); renderQuestions();
  };

  const inStatus = () => allQuestions.filter(q => selectedStatus === "learned" ? q.learned : !q.learned);

  window.deleteQuestion = async (docId) => {
    const q = allQuestions.find(x => x.id === docId);
    if (!q) return;
    if (!confirm(`"${q.subTopic || q.topic || "Bu spot"}" silinsin mi?`)) return;
    try {
      await updateDoc(doc(db, COL, docId), { deleted: true });
      allQuestions = allQuestions.filter(x => x.id !== docId);
      refreshAll();
      showToast("Spot silindi", async () => {
        await updateDoc(doc(db, COL, docId), { deleted: false });
        await loadUserQuestions();
      });
    } catch (err) { console.error("Silme hatası:", err); alert("Silinirken hata oluştu."); }
  };

  window.reactivateQuestion = async (docId) => {
    await updateDoc(doc(db, COL, docId), { learned: false, box: 0, nextReview: Date.now() });
    await loadUserQuestions();
  };

  function renderFilters() {
    const list = inStatus();
    const branches = ["All", ...new Set(list.map(q => q.branch).filter(Boolean))];
    if (selectedBranchFilter !== "All" && !branches.includes(selectedBranchFilter)) selectedBranchFilter = "All";
    $("branchFilters").innerHTML = branches.map(b =>
      `<button class="chip ${selectedBranchFilter === b ? "on" : ""}" data-b="${esc(b)}" onclick="setFilter(this.dataset.b)">${b === "All" ? "Tümü " + list.length : esc(b)}</button>`).join("");
  }
  window.setFilter = (b) => { selectedBranchFilter = b; renderFilters(); renderQuestions(); };

  function reviewLabel(q) {
    if (q.learned) return "Öğrenildi";
    const diff = q.nextReview - Date.now();
    if (diff <= 0) return "Tekrar zamanı geldi";
    return Math.ceil(diff / DAY) + " gün sonra tekrar";
  }

  function renderQuestions() {
    const base = inStatus();
    const filtered = selectedBranchFilter === "All" ? base : base.filter(q => q.branch === selectedBranchFilter);
    const box = $("questionsList");
    if (!filtered.length) {
      box.innerHTML = `<div class="empty">${selectedStatus === "learned" ? "Henüz öğrenilmiş spot yok." : "Arşivde spot yok. Soru ekle sekmesinden ilk spotunu kaydedebilirsin."}</div>`;
      return;
    }
    box.innerHTML = filtered.map(q => `
      <article class="item">
        <div class="item-head">
          <div>
            <div class="item-title">${esc(q.subTopic || q.topic || "Konu yok")}</div>
            <div class="item-meta">${esc([q.branch, q.topic].filter(Boolean).join(", "))}</div>
          </div>
        </div>
        <div class="spot">${fmt(q.keyTakeaway)}</div>
        <div class="item-foot">
          <span class="muted">Seviye ${q.box}/5, ${reviewLabel(q)}</span>
          <div class="actions">
            ${q.learned ? `<button class="link" onclick="reactivateQuestion('${esc(q.id)}')">Tekrar aktif et</button>` : ""}
            <button class="link danger" onclick="deleteQuestion('${esc(q.id)}')">Sil</button>
          </div>
        </div>
        <details style="margin-top:12px">
          <summary>Çözümü göster</summary>
          <div class="reading pre">${fmt(q.aiExplanation)}</div>
        </details>
      </article>`).join("");
  }

  function pickNextQuestion() {
    const now = Date.now();
    const active = allQuestions.filter(q => !q.learned);
    if (!active.length) { alert("Test için arşivinde çalışılacak en az bir spot olmalı."); return null; }
    let pool = active.filter(q => q.nextReview <= now).sort((a, b) => a.nextReview - b.nextReview);
    if (!pool.length) {
      if (!confirm("Bugün vadesi gelen spot yok. Yine de çalışmak ister misin?")) return null;
      pool = [...active].sort((a, b) => a.nextReview - b.nextReview);
    }
    return pool[Math.floor(Math.random() * Math.min(pool.length, 5))];
  }

  window.generateQuiz = async () => {
    const picked = pickNextQuestion();
    if (!picked) return;
    activeQuizQuestion = picked;

    const btn = $("newQuizBtn");
    btn.disabled = true; btn.textContent = "Soru hazırlanıyor…";

    $("quizContainer").classList.remove("hidden");
    $("quizQuestion").textContent = "Spot bilgiden yeni bir vaka sorusu hazırlanıyor…";
    $("quizOptions").innerHTML = "";
    $("quizResult").classList.add("hidden");
    $("quizSubBadge").textContent = [picked.branch, picked.topic].filter(Boolean).join(", ");
    $("quizStreakBadge").textContent = `Seviye ${picked.box}/5`;

    const prompt = `
Sen bir TUS soru yazarısın. Kullanıcının daha önce takıldığı şu spot bilgiyi ölçen, orijinal TUS formatında, 5 şıklı (A, B, C, D, E) klinik bir vaka sorusu yaz:
Branş/Konu: ${picked.branch} - ${picked.topic} (${picked.subTopic || ""})
Spot Bilgi: ${picked.keyTakeaway}
Detay: ${picked.aiExplanation}

Sadece aşağıdaki JSON formatında yanıt ver:
{
  "question": "Klinik vaka sorusu metni",
  "options": { "A": "A şıkkı", "B": "B şıkkı", "C": "C şıkkı", "D": "D şıkkı", "E": "E şıkkı" },
  "answer": "Doğru şık harfi (Sadece A, B, C, D veya E)",
  "explanation": "Kısa ve net çözüm açıklaması"
}
    `;

    try {
      const text = await callWorker({ prompt, model: currentModel });
      currentQuizData = extractCleanJSON(text);
      $("quizQuestion").textContent = currentQuizData.question;
      const oc = $("quizOptions");
      oc.innerHTML = "";
      Object.entries(currentQuizData.options).forEach(([key, val]) => {
        const b = document.createElement("button");
        b.className = "opt"; b.dataset.key = key;
        b.innerHTML = `<span class="k">${esc(key)}</span><span>${esc(val)}</span>`;
        b.onclick = () => handleQuizSelection(key, b);
        oc.appendChild(b);
      });
    } catch (err) {
      console.error("Quiz üretim hatası:", err);
      $("quizQuestion").textContent = "Soru üretilemedi: " + err.message;
    } finally {
      btn.disabled = false; btn.textContent = "Soru getir";
    }
  };

  async function handleQuizSelection(selectedKey, clickedBtn) {
    if (!currentQuizData || !activeQuizQuestion) return;
    const btns = document.querySelectorAll("#quizOptions .opt");
    btns.forEach(b => b.disabled = true);

    const correctKey = currentQuizData.answer.trim().toUpperCase().charAt(0);
    const isCorrect = selectedKey === correctKey;
    clickedBtn.classList.add(isCorrect ? "right" : "wrong");
    if (!isCorrect) btns.forEach(b => { if (b.dataset.key === correctKey) b.classList.add("right"); });

    const qRef = doc(db, COL, activeQuizQuestion.id);
    const oldBox = activeQuizQuestion.box || 0;
    let note = "";

    try {
      if (isCorrect) {
        const newBox = oldBox + 1;
        if (newBox >= 5) {
          await updateDoc(qRef, { box: 5, learned: true, nextReview: Date.now() + 90 * DAY });
          note = "Tüm tekrar aşamalarını geçtin. Spot Öğrenilen bölümüne taşındı.";
        } else {
          const days = INTERVAL_DAYS[newBox - 1];
          await updateDoc(qRef, { box: newBox, nextReview: Date.now() + days * DAY });
          note = `Seviye ${newBox}/5. Bu spot ${days} gün sonra tekrar sorulacak.`;
        }
      } else {
        await updateDoc(qRef, { box: 0, nextReview: Date.now() });
        note = "Spot Seviye 0'a döndü ve kısa sürede tekrar karşına çıkacak.";
      }
      await loadUserQuestions();
    } catch (e) { console.error("Güncellenemedi:", e); }

    const res = $("quizResult");
    res.className = isCorrect ? "right" : "wrong";
    $("quizResultTitle").textContent = isCorrect ? `Doğru, cevap ${correctKey}` : `Yanlış, doğru cevap ${correctKey}`;
    $("quizNote").textContent = note;
    $("quizExplanation").innerHTML = fmt(currentQuizData.explanation);
  }
</script>
</body>
</html>
